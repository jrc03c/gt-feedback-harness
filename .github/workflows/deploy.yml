name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      - run: npm test

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase db start
      - run: supabase test db

  # Also runs on the weekly schedule, which refreshes the copy of GuidedTrack's
  # font declarations (see scripts/gt-fonts.mjs).
  deploy:
    needs: [test, db-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_DB_URL_TEMPLATE: ${{ secrets.SUPABASE_DB_URL_TEMPLATE }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # The pooler URL is passed explicitly because the direct database host is
      # IPv6-only and GitHub's runners have no IPv6. `supabase link` would record
      # the pooler route, but only with an access token broad enough to read it.
      - run: supabase db push --db-url "$(node -e 'import("./scripts/db-url.mjs").then(m => console.log(m.databaseUrl()))')"
      - run: npm ci
      - run: npm run build
      - run: |
          mkdir -p site
          cp index.html site/
          cp -r dist site/dist
      - run: node scripts/gt-fonts.mjs site/gt-fonts.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node -e "import('./src/config.js').then(c => { process.stdout.write(c.SUPABASE_URL + '\n' + c.SUPABASE_ANON_KEY) })" > creds.txt
      - run: |
          SUPABASE_URL=$(sed -n 1p creds.txt) SUPABASE_ANON_KEY=$(sed -n 2p creds.txt) node scripts/keep-alive.mjs
